reviews:
  profile: chill
  request_changes_workflow: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
    - main
    - master
    - develop
  high_level_summary: true
  review_status_comment: true
  poem: false
  collapse_walkthrough: false
  auto_approve:
    enabled: false
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: project
language: en-US
early_access: false
path_instructions:
- path: '**/*.md'
  instructions: 'Review documentation for:

    - Clarity and accuracy

    - Proper formatting

    - Working links

    - Code example correctness

    '
- path: tests/**/*
  instructions: 'Review tests for:

    - Adequate coverage

    - Clear test names

    - Proper assertions

    - Edge case handling

    '
- path: '**/README.md'
  instructions: 'Review README for:

    - Clear project description

    - Installation instructions

    - Usage examples

    - Contributing guidelines

    '
- path: '**/*.py'
  instructions: 'Review Python code for:

    - Style consistency and readability

    - Type hints where applicable (project standards)

    - Error handling and edge cases

    - Security considerations (input handling, secrets)

    '
- path: '**/test_*.py'
  instructions: 'Review Python tests for:

    - Adequate coverage

    - Clear assertions and failure messages

    - Isolation (no cross-test coupling)

    - Deterministic behavior (no flaky time/network deps)

    '
- path: '**/*.ts'
  instructions: 'Review TypeScript code for:

    - Type safety and proper type annotations

    - Avoid ''any'' types where possible

    - Use of strict mode features

    - Proper interface/type definitions

    - Generic usage and constraints

    '
- path: '**/*.tsx'
  instructions: 'Review TypeScript React components for:

    - Proper component typing (FC, props interfaces)

    - Type-safe event handlers

    - Correct hook typing (useState, useEffect, etc.)

    - Props interface documentation

    '
- path: '**/tsconfig*.json'
  instructions: 'Review TypeScript configuration for:

    - Strict mode settings

    - Module resolution strategy

    - Target and lib settings

    - Path aliases configuration

    '
- path: app/**/*.tsx
  instructions: 'Review Next.js App Router patterns:

    - Proper Server vs Client Component usage (''use client'' directive)

    - Data fetching patterns (async components, streaming)

    - Loading and error states

    - Parallel and intercepting routes

    - Dynamic routes and params handling

    '
- path: '**/route.ts'
  instructions: 'Focus on API route security and quality:

    - Input validation and sanitization

    - Authentication and authorization checks

    - Proper error handling and status codes

    - Rate limiting considerations

    - Request/response type safety

    '
- path: '**/layout.tsx'
  instructions: 'Evaluate layout implementation:

    - Proper metadata generation

    - Loading states and suspense boundaries

    - Layout composition and nesting

    - Shared UI patterns

    - Performance implications

    '
- path: '**/page.tsx'
  instructions: 'Review page components for:

    - SEO optimization (metadata, structured data)

    - Proper data fetching strategies

    - Error boundaries

    - Loading states

    - Static vs dynamic rendering decisions

    '
- path: '**/*.{tsx,jsx}'
  instructions: 'Review Tailwind CSS usage:

    - Proper utility class usage and composition

    - Responsive design patterns (sm:, md:, lg:, xl:)

    - Dark mode support where applicable

    - Avoid arbitrary values unless necessary

    - Consistent spacing and sizing scale

    - Accessibility (focus states, contrast)

    '
- path: '**/globals.css'
  instructions: 'Evaluate global CSS organization:

    - Proper @layer usage (base, components, utilities)

    - Custom utility definitions

    - CSS variable usage

    - Theme customization

    - Import order and structure

    '
- path: '**/*.test.ts'
  instructions: 'Enforce TDD compliance and test quality:

    - NO MOCKS - tests must use real implementations

    - Real assertions with meaningful expectations

    - Edge cases and error scenarios coverage

    - Test isolation and independence

    - Clear test descriptions and structure

    - Proper setup and teardown

    '
- path: '**/*.test.tsx'
  instructions: 'Review component testing practices:

    - User-centric testing (user-event, not fireEvent)

    - Accessibility testing (screen readers, ARIA)

    - Real user interactions and behaviors

    - NO MOCKS - test real component behavior

    - Proper async handling and waiting

    - Integration over isolated unit tests

    '
- path: '**/*.spec.ts'
  instructions: 'Evaluate integration test patterns:

    - End-to-end workflow testing

    - Real dependencies and services

    - Proper test data management

    - Error handling verification

    - Performance considerations

    - Test maintainability

    '
