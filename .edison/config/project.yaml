# Edison UI Project Configuration (Project Metadata)

project:
  name: edison-ui
  description: "Local-first dashboard for Edison projects (FastAPI + Next.js)."
  language: typescript

  # Metadata used by templates/validators (no behavioral impact by itself).
  tech_stack:
    - nextjs
    - react
    - typescript
    - tailwind
    - vitest
    - fastapi
    - python

  paths:
    frontendDir: frontend
    backendDir: backend

worktrees:
  sharedState:
    sharedPaths:
      - path: ".specify"
        scopes: ["primary", "session"]
      - path: "specs"
        scopes: ["primary", "session"]
      - path: ".openspec"
        scopes: ["primary", "session"]
      - path: ".claude"
        scopes: ["primary", "session"]
      - path: ".codex"
        scopes: ["primary", "session"]
      - path: ".augment"
        scopes: ["primary", "session"]
      - path: ".cursor"
        scopes: ["primary", "session"]
      - path: ".zen"
        scopes: ["primary", "session"]

      # `.edison/config/*` stays tracked as a bootstrap config source.
      - path: ".edison/agents"
        scopes: ["primary", "session"]
      - path: ".edison/validators"
        scopes: ["primary", "session"]
      - path: ".edison/guidelines"
        scopes: ["primary", "session"]
      - path: ".edison/constitutions"
        scopes: ["primary", "session"]
      - path: ".edison/scripts"
        scopes: ["primary", "session"]

    commitGuard:
      allowPrefixes:
        - ".project/tasks/"
        - ".project/qa/"
        - ".specify/"
        - "specs/"
        - ".openspec/"
        - ".claude/"
        - ".codex/"
        - ".augment/"
        - ".cursor/"
        - ".zen/"
        - ".edison/agents/"
        - ".edison/validators/"
        - ".edison/guidelines/"
        - ".edison/constitutions/"
        - ".edison/scripts/"
