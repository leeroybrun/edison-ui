validation:
  context7:
    enabled: false
  defaultPreset: custom-minimal
  presets:
    custom-minimal:
      blocking_validators:
      - global-claude
      - browser-e2e
      description: Minimal validation with global-codex, global-claude, and browser-e2e
        only
      name: custom-minimal
      required_evidence:
      - command-type-check.txt
      - command-lint.txt
      - command-test.txt
      - command-build.txt
      validators:
      - global-codex
      - global-claude
      - browser-e2e
      waves:
        critical:
        - global-claude
        - browser-e2e
        optional:
        - global-codex
  timeout: 900
  validators:
    browser-e2e:
      blocking: true
      config:
        baseUrl: http://localhost:3334
        skipIfNoTriggers: true
      timeout: 900
      triggers:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/components/**/*'
      - '**/app/**/*.tsx'
      - '**/pages/**/*'
      - '**/styles/**/*'
      - '**/public/**/*'
      web_server:
        cwd: ''
        ensure_running: true
        healthcheck_url: http://localhost:3334
        start_command: './scripts/start-e2e-servers.sh'
        stop_after: validation
        stop_command: 'pkill -f "uvicorn main:app --port 8002" || true; pkill -f "next dev.*3334" || true'
        url: http://localhost:3334
    global-auggie:
      enabled: false
    global-claude:
      always_run: true
      blocking: true
      timeout: 900
    global-codex:
      always_run: true
      blocking: false
      timeout: 900
    global-gemini:
      enabled: false
    testing:
      blocking: false
