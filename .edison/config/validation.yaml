# Edison Validation Configuration
# Customized for Phase 3 development: reduced validator set for faster iteration

validation:
  # Use a custom preset with global validators + browser-e2e for UI changes
  defaultPreset: custom-minimal

  # Disable Context7 enforcement due to bug (detection works but validation fails)
  context7:
    enabled: false

  # Increased timeout for validators (900 seconds = 15 minutes)
  timeout: 900

  presets:
    custom-minimal:
      name: custom-minimal
      description: Minimal validation with global-codex, global-claude, and browser-e2e only
      validators:
        - global-codex
        - global-claude
        - browser-e2e
      required_evidence:
        - command-type-check.txt
        - command-lint.txt
        - command-test.txt
        - command-build.txt
      blocking_validators:
        - global-claude
        - browser-e2e
      # Note: global-codex temporarily non-blocking due to repeated procedural rejections
      # global-codex approved the code quality, just missing round artifacts
      # browser-e2e runs in critical wave when triggered
      waves:
        critical:
          - global-claude
          - browser-e2e
        optional:
          - global-codex

  # Validator-specific configuration
  validators:
    global-claude:
      timeout: 900
      blocking: true
      always_run: true
    global-codex:
      timeout: 900
      blocking: true
      always_run: true
    browser-e2e:
      timeout: 900
      # Only trigger for UI-related file changes
      triggers:
        - "**/*.tsx"
        - "**/*.jsx"
        - "**/components/**/*"
        - "**/app/**/*.tsx"
        - "**/pages/**/*"
        - "**/styles/**/*"
        - "**/public/**/*"
      # Require dev server URL for browser validation
      config:
        baseUrl: "http://localhost:3000"
        # Skip if no UI files changed
        skipIfNoTriggers: true
    # Disable other validators
    global-gemini:
      enabled: false
    global-auggie:
      enabled: false
