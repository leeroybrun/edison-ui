validation:
  context7:
    enabled: false
  defaultPreset: custom-minimal
  defaults:
    web_server:
      lock:
        enabled: true
  presets:
    custom-minimal:
      blocking_validators:
      - global-claude
      - browser-e2e
      description: Minimal validation with global-codex, global-claude, and browser-e2e
        only
      name: custom-minimal
      required_evidence:
      - command-type-check.txt
      - command-lint.txt
      - command-test.txt
      - command-build.txt
      validators:
      - global-codex
      - global-claude
      - browser-e2e
      waves:
        critical:
        - global-claude
        - browser-e2e
        optional:
        - global-codex
  validators:
    browser-e2e:
      blocking: true
      config:
        baseUrl: http://localhost:3334
        skipIfNoTriggers: true
      triggers:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/components/**/*'
      - '**/app/**/*.tsx'
      - '**/pages/**/*'
      - '**/styles/**/*'
      - '**/public/**/*'
      web_server:
        ref: browser-e2e
        stop_after: true
        url: http://localhost:3334
    global-auggie:
      enabled: false
    global-claude:
      always_run: true
      blocking: true
    global-codex:
      always_run: true
      blocking: false
    global-gemini:
      enabled: false
    testing:
      blocking: false
  web_servers:
    browser-e2e:
      ensure_running: true
      healthcheck_url: http://localhost:3334
      start:
        command: ./.edison/scripts/start-server.sh
        cwd: .
      stop:
        command: ./.edison/scripts/stop-server.sh
        cwd: .
        run_even_if_no_process: true
      url: http://localhost:3334
      verify:
        steps:
        - kind: http
          url: '{probe_url}'
        - command: ./.edison/scripts/verify-server.sh
          kind: command
    edison-ui-browser-e2e:
      ensure_running: true
      healthcheck_url: http://localhost:3334
      start:
        command: ./.edison/scripts/start-server.sh
        cwd: .
      stop:
        command: ./.edison/scripts/stop-server.sh
        cwd: .
        run_even_if_no_process: true
      url: http://localhost:3334
      verify:
        steps:
        - kind: http
          url: '{probe_url}'
        - command: ./.edison/scripts/verify-server.sh
          kind: command
