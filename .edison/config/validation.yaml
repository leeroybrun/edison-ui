validation:
  context7:
    enabled: false
  timeout: 1800
  defaults:
    web_server:
      lock:
        enabled: true
  defaultPreset: custom-minimal
  presets:
    custom-minimal:
      blocking_validators:
      - global-claude
      - browser-e2e
      description: Minimal validation with global-codex, global-claude, and browser-e2e
        only
      name: custom-minimal
      required_evidence:
      - command-type-check.txt
      - command-lint.txt
      - command-test.txt
      - command-build.txt
      validators:
      - global-codex
      - global-claude
      - browser-e2e
      waves:
        critical:
        - global-claude
        - browser-e2e
        optional:
        - global-codex
  web_servers:
    edison-ui-browser-e2e:
      url: http://localhost:3334
      healthcheck_url: http://localhost:3334
      ensure_running: true
      start:
        command: "./.edison/scripts/start-server.sh"
        cwd: "."
      stop:
        command: "./.edison/scripts/stop-server.sh"
        cwd: "."
        run_even_if_no_process: true
      verify:
        steps:
          - kind: http
            url: "{probe_url}"
          - kind: command
            command: "./.edison/scripts/verify-server.sh"
  validators:
    browser-e2e:
      blocking: true
      config:
        baseUrl: http://localhost:3334
        skipIfNoTriggers: true
      timeout: 1800
      triggers:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/components/**/*'
      - '**/app/**/*.tsx'
      - '**/pages/**/*'
      - '**/styles/**/*'
      - '**/public/**/*'
      web_server:
        ref: edison-ui-browser-e2e
        url: http://localhost:3334
        stop_after: true
    global-auggie:
      enabled: false
    global-claude:
      always_run: true
      blocking: true
    global-codex:
      always_run: true
      blocking: false
    global-gemini:
      enabled: false
    testing:
      blocking: false
